<!-- Calculator Page -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooling Calculators | Dekoolar</title>
    <style>
        .calculator-section {
            padding: 60px 0;
            background: var(--light-gray);
            min-height: calc(100vh - var(--header-height) - var(--topbar-height));
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .page-title {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
            font-weight: 600;
            position: relative;
            padding-bottom: 15px;
        }

        .page-title:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: var(--secondary-color);
            border-radius: 2px;
        }
        
        .calculator-container {
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 32px;
            margin-bottom: 32px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .calculator-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.15);
        }
        
        .calculator-title {
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 1.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .calculator-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 24px;
            background: var(--secondary-color);
            border-radius: 2px;
        }
        
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-color);
            font-weight: 500;
            font-size: 0.95rem;
        }
        
        .input-group input, 
        .input-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--white);
            color: var(--text-color);
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0,51,153,0.1);
        }

        .input-group input:hover,
        .input-group select:hover {
            border-color: var(--primary-color);
        }
        
        .calculate-btn {
            background: var(--primary-color);
            color: var(--white);
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 160px;
        }
        
        .calculate-btn:hover {
            background: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,104,55,0.2);
        }

        .calculate-btn:active {
            transform: translateY(0);
        }
        
        .result {
            margin-top: 25px;
            padding: 20px;
            background: var(--light-gray);
            border-radius: 8px;
            border-left: 4px solid var(--secondary-color);
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        .result strong {
            color: var(--primary-color);
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .calculator-section {
                padding: 40px 0;
            }

            .page-title {
                font-size: 2rem;
            }

            .calculator-container {
                padding: 24px;
                margin-bottom: 24px;
            }

            .calculator-title {
                font-size: 1.5rem;
            }

            .input-group input,
            .input-group select,
            .calculate-btn {
                padding: 10px 16px;
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            .calculator-container {
                background: #1a1a1a;
                box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            }

            .input-group input,
            .input-group select {
                background: #2d2d2d;
                border-color: #404040;
                color: #ffffff;
            }

            .result {
                background: #2d2d2d;
            }
        }
    </style>
</head>
<body>
    {% include "templates/includes/header.html" %}
    
    <div class="calculator-section">
        <div class="container">
            <h1 class="text-center mb-5">Cooling Calculators</h1>
            
            <!-- Cold Room Size Calculator -->
            <div class="calculator-container">
                <h2 class="calculator-title">Cold Room Size Calculator</h2>
                <div class="input-group">
                    <label for="storage-volume">Required Storage Volume (m³)</label>
                    <input type="number" id="storage-volume" step="0.1" min="0">
                </div>
                <div class="input-group">
                    <label for="product-type">Product Type</label>
                    <select id="product-type">
                        <option value="fresh">Fresh Produce</option>
                        <option value="frozen">Frozen Products</option>
                        <option value="dairy">Dairy Products</option>
                        <option value="meat">Meat Products</option>
                    </select>
                </div>
                <button class="calculate-btn" onclick="calculateRoomSize()">Calculate Size</button>
                <div id="size-result" class="result"></div>
            </div>
            
            <!-- Cooling Load Calculator -->
            <div class="calculator-container">
                <h2 class="calculator-title">Cooling Load Calculator</h2>
                <div class="input-group">
                    <label for="room-length">Room Length (m)</label>
                    <input type="number" id="room-length" step="0.1" min="0">
                </div>
                <div class="input-group">
                    <label for="room-width">Room Width (m)</label>
                    <input type="number" id="room-width" step="0.1" min="0">
                </div>
                <div class="input-group">
                    <label for="room-height">Room Height (m)</label>
                    <input type="number" id="room-height" step="0.1" min="0">
                </div>
                <div class="input-group">
                    <label for="target-temp">Target Temperature (°C)</label>
                    <input type="number" id="target-temp" step="1">
                </div>
                <button class="calculate-btn" onclick="calculateCoolingLoad()">Calculate Load</button>
                <div id="load-result" class="result"></div>
            </div>
            
            <!-- Energy Cost Calculator -->
            <div class="calculator-container">
                <h2 class="calculator-title">Energy Cost Calculator</h2>
                <div class="input-group">
                    <label for="power-rating">System Power Rating (kW)</label>
                    <input type="number" id="power-rating" step="0.1" min="0">
                </div>
                <div class="input-group">
                    <label for="daily-hours">Daily Operating Hours</label>
                    <input type="number" id="daily-hours" step="0.5" min="0" max="24">
                </div>
                <div class="input-group">
                    <label for="electricity-rate">Electricity Rate (per kWh)</label>
                    <input type="number" id="electricity-rate" step="0.01" min="0">
                </div>
                <button class="calculate-btn" onclick="calculateEnergyCost()">Calculate Cost</button>
                <div id="cost-result" class="result"></div>
            </div>
        </div>
    </div>
    
    <script>
        function calculateRoomSize() {
            const volume = parseFloat(document.getElementById('storage-volume').value);
            const productType = document.getElementById('product-type').value;
            
            if (!volume) {
                alert('Please enter the storage volume');
                return;
            }
            
            // Add 30% for aisles and handling space
            const totalVolume = volume * 1.3;
            const height = 3; // Standard height
            const area = totalVolume / height;
            const width = Math.sqrt(area);
            const length = area / width;
            
            const result = document.getElementById('size-result');
            result.innerHTML = `
                <strong>Recommended Room Dimensions:</strong><br>
                Length: ${length.toFixed(2)} meters<br>
                Width: ${width.toFixed(2)} meters<br>
                Height: ${height.toFixed(2)} meters<br>
                Total Floor Area: ${area.toFixed(2)} m²
            `;
            result.style.display = 'block';
        }
        
        function calculateCoolingLoad() {
            const length = parseFloat(document.getElementById('room-length').value);
            const width = parseFloat(document.getElementById('room-width').value);
            const height = parseFloat(document.getElementById('room-height').value);
            const targetTemp = parseFloat(document.getElementById('target-temp').value);
            
            if (!length || !width || !height || isNaN(targetTemp)) {
                alert('Please fill in all fields');
                return;
            }
            
            const volume = length * width * height;
            // Basic cooling load calculation (simplified)
            const loadFactor = targetTemp <= 0 ? 40 : 30; // W/m³
            const coolingLoad = volume * loadFactor;
            
            const result = document.getElementById('load-result');
            result.innerHTML = `
                <strong>Estimated Cooling Load:</strong><br>
                ${(coolingLoad/1000).toFixed(2)} kW<br>
                Room Volume: ${volume.toFixed(2)} m³
            `;
            result.style.display = 'block';
        }
        
        function calculateEnergyCost() {
            const power = parseFloat(document.getElementById('power-rating').value);
            const hours = parseFloat(document.getElementById('daily-hours').value);
            const rate = parseFloat(document.getElementById('electricity-rate').value);
            
            if (!power || !hours || !rate) {
                alert('Please fill in all fields');
                return;
            }
            
            const dailyUsage = power * hours;
            const dailyCost = dailyUsage * rate;
            const monthlyCost = dailyCost * 30;
            const yearlyCost = dailyCost * 365;
            
            const result = document.getElementById('cost-result');
            result.innerHTML = `
                <strong>Estimated Energy Costs:</strong><br>
                Daily: ${dailyCost.toFixed(2)}<br>
                Monthly: ${monthlyCost.toFixed(2)}<br>
                Yearly: ${yearlyCost.toFixed(2)}
            `;
            result.style.display = 'block';
        }
    </script>
    
    {% include "templates/includes/footer.html" %}
</body>
</html>
